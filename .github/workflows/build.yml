name: Build Hydrogen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc git bison flex libssl-dev libncurses5-dev libelf-dev zip wget curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          # Քաշում ենք ստուգված Proton Clang-ը
          git clone --depth=1 https://github.com/trinket-devs/proton-clang clang-r563880c

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_BIN="$(pwd)/clang-r563880c/bin"
          export PATH="$PATH:$CLANG_BIN"
          export CC="$CLANG_BIN/clang"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Կոպիտ ուժով հեռացնում ենք VDSO-ն, որ չտա այդ սխալը
          rm -rf arch/arm64/kernel/vdso/*
          echo "obj-y := dummy.o" > arch/arm64/kernel/vdso/Makefile

          make O=out pissarro_defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydrogen-Test-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb
          
