name: Build Hydrogen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc git bison flex libssl-dev libncurses5-dev libelf-dev zip
          
          # Клонируем Clang r563880c напрямую из зеркала GitLab — это сработает без ошибок
          git clone https://gitlab.com/Neebe3289/android_prebuilts_clang_host_linux-x86.git -b 14 --depth=1 clang-r563880c

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang-r563880c/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out pissarro_defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydrogen-Test-Kernel
          path: out/arch/arm64/boot/
          
