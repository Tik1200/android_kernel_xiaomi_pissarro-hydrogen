name: Build Hydrogen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc git bison flex libssl-dev libncurses5-dev libelf-dev zip wget curl
          
          # Скачиваем официальный и стабильный пребилт AOSP Clang (r450784d / Clang 14)
          # Эта версия гарантированно работает на ubuntu-latest и собирает ядра Android 12-14
          mkdir -p aosp-clang
          curl -Lo clang.tar.gz "https://googlesource.com"
          tar -xzf clang.tar.gz -C aosp-clang
          rm clang.tar.gz

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Добавляем наш рабочий Clang в PATH
          export PATH="$(pwd)/aosp-clang/bin:$PATH"
          
          # Настройки компиляции для Xiaomi (pissarro)
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Конфигурация ядра
          make O=out pissarro_defconfig
          
          # Отключаем VDSO, если в нем были ошибки
          ./scripts/config --file out/.config -d VDSO
          ./scripts/config --file out/.config -d COMPAT_VDSO
          make O=out olddefconfig

          # Запуск сборки
          make -j$(nproc) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydrogen-Test-Kernel
          path: out/arch/arm64/boot/
          
