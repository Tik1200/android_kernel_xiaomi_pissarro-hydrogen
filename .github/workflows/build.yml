name: Build Hydrogen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc git bison flex libssl-dev libncurses5-dev libelf-dev zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          git clone --depth=1 \
            https://github.com/trinket-devs/proton-clang \
            clang-r563880c

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_BIN="$(pwd)/clang-r563880c/bin"
          # toolchain-ը ավելացնում ենք PATH-ի ՎԵՐՋՈՒՄ, որ host tool-ները (fixdep և այլն)
          # շարունակեն գտնել system-ի ld/gcc-ն, ոչ թե toolchain-ի incompatible ld-ն
          export PATH="$PATH:$CLANG_BIN"
          export CC="$CLANG_BIN/clang"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out pissarro_defc
